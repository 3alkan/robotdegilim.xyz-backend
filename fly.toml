# fly.toml app configuration file generated for robotdegilim-xyz-backend on 2026-09-06T18:47:25+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'robotdegilim-xyz-backend'
primary_region = 'fra'

[build]
[processes]
  web = "uv run start.py server"
  # Uncomment the line below to deploy the background worker as a separate, isolated machine
  # worker = "uv run start.py worker"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = false
  min_machines_running = 0
  processes = ['web']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
